events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Important configurations to prevent issues with SSE streams
    proxy_buffering off;
    proxy_set_header Connection "keep-alive";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Optimize WebSocket connections
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Disable body size limits for file uploads
        client_max_body_size 0;

        # Dashboard UI
        location / {
            proxy_pass http://dashboard:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }



        # Open WebUI
        # Requires ROOT_PATH=/chat on open-webui container env
        location /chat/ {
            proxy_pass http://open-webui:8080/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Web UI requires websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Llama-server (inference API)
        location /llm/ {
            rewrite ^/llm/(.*) /$1 break;
            proxy_pass http://llama-server:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable buffering for streaming inferences
            proxy_buffering off;
        }

        # n8n
        # Requires N8N_PATH=/n8n/ and properly set WEBHOOK_URL
        location /n8n/ {
            proxy_pass http://n8n:5678/n8n/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Additional headers typically required by n8n behind a proxy
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # n8n uses SSE/WebSockets for editor updates -> no buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
