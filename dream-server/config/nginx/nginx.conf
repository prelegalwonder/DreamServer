events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Important configurations to prevent issues with SSE streams
    proxy_buffering off;
    proxy_set_header Connection "keep-alive";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Optimize WebSocket connections
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker internal DNS resolver (prevents 502s when backend containers restart)
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Disable body size limits for file uploads
        client_max_body_size 0;

        # Dashboard UI
        location / {
            set $upstream_dashboard http://dashboard:3001;
            proxy_pass $upstream_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }



        # Open WebUI
        # Requires ROOT_PATH=/chat on open-webui container env
        location /chat/ {
            set $upstream_webui http://open-webui:8080;
            rewrite ^/chat/(.*) /chat/$1 break;
            proxy_pass $upstream_webui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Web UI requires websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Llama-server (inference API)
        location /llm/ {
            set $upstream_llama http://llama-server:8080;
            rewrite ^/llm/(.*) /$1 break;
            proxy_pass $upstream_llama;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Disable buffering for streaming inferences
            proxy_buffering off;
        }

        # n8n
        # Requires N8N_PATH=/n8n/ and properly set WEBHOOK_URL
        location /n8n/ {
            set $upstream_n8n http://n8n:5678;
            rewrite ^/n8n/(.*) /n8n/$1 break;
            proxy_pass $upstream_n8n;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Additional headers typically required by n8n behind a proxy
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # n8n uses SSE/WebSockets for editor updates -> no buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # ComfyUI
        location /comfy/ {
            set $upstream_comfyui http://comfyui:8188;
            rewrite ^/comfy/(.*) /$1 break;
            proxy_pass $upstream_comfyui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Web UI requires websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # SearXNG
        location /searx/ {
            set $upstream_searxng http://searxng:8080;
            rewrite ^/searx/(.*) /$1 break;
            proxy_pass $upstream_searxng;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Perplexica (Search)
        location /search/ {
            set $upstream_perplexica http://perplexica:3000;
            rewrite ^/search/(.*) /$1 break;
            proxy_pass $upstream_perplexica;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Socket.io support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # DreamForge
        location /forge/ {
            set $upstream_dreamforge http://dreamforge:3010;
            rewrite ^/forge/(.*) /$1 break;
            proxy_pass $upstream_dreamforge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OpenClaw
        location /claw/ {
            set $upstream_openclaw http://openclaw:18789;
            rewrite ^/claw/(.*) /$1 break;
            proxy_pass $upstream_openclaw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Socket.io/Websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # TokenSpy
        location /spy/ {
            set $upstream_tokenspy http://token-spy:8080;
            rewrite ^/spy/(.*) /$1 break;
            proxy_pass $upstream_tokenspy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Whisper (STT)
        location /whisper/ {
            set $upstream_whisper http://whisper:8000;
            rewrite ^/whisper/(.*) /$1 break;
            proxy_pass $upstream_whisper;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Qdrant (Vector DB)
        location /qdrant/ {
            set $upstream_qdrant http://qdrant:6333;
            rewrite ^/qdrant/(.*) /$1 break;
            proxy_pass $upstream_qdrant;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # LiteLLM (Gateway)
        location /gateway/ {
            set $upstream_litellm http://litellm:4000;
            rewrite ^/gateway/(.*) /$1 break;
            proxy_pass $upstream_litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # LiteLLM UI/Websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Embeddings
        location /embeddings/ {
            set $upstream_embeddings http://embeddings:80;
            rewrite ^/embeddings/(.*) /$1 break;
            proxy_pass $upstream_embeddings;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # TTS (Kokoro)
        location /tts/ {
            set $upstream_tts http://tts:8880;
            rewrite ^/tts/(.*) /$1 break;
            proxy_pass $upstream_tts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Privacy Shield
        location /shield/ {
            set $upstream_shield http://privacy-shield:8085;
            rewrite ^/shield/(.*) /$1 break;
            proxy_pass $upstream_shield;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OpenCode (Host Service)
        location /code/ {
            # host.docker.internal requires extra_hosts or recent docker
            set $upstream_opencode http://host.docker.internal:3003;
            rewrite ^/code/(.*) /$1 break;
            proxy_pass $upstream_opencode;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # IDE requires websocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # APE (Agent Governance)
        location /ape/ {
            set $upstream_ape http://ape:7890;
            rewrite ^/ape/(.*) /$1 break;
            proxy_pass $upstream_ape;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
