services:
  comfyui:
    build:
      context: ./extensions/services/comfyui
      dockerfile: Dockerfile
    container_name: dream-comfyui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - dream-server_comfyui-models:/models
      - dream-server_comfyui-output:/output
      - dream-server_comfyui-input:/input
      - ./data/comfyui/workflows:/workflows:ro
    shm_size: '8g'
    deploy:
      resources:
        limits:
          cpus: '16.0'
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8188"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dream-server_comfyui-models:
    name: dream-server_comfyui-models
    driver: local
    driver_opts:
      type: none
      device: ${DREAM_DATA_ROOT}/comfyui/models
      o: bind
  dream-server_comfyui-output:
    name: dream-server_comfyui-output
    driver: local
    driver_opts:
      type: none
      device: ${DREAM_DATA_ROOT}/comfyui/output
      o: bind
  dream-server_comfyui-input:
    name: dream-server_comfyui-input
    driver: local
    driver_opts:
      type: none
      device: ${DREAM_DATA_ROOT}/comfyui/input
      o: bind
